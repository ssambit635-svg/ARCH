name: CI
on:
  push:
  pull_request:

# Least privilege: the workflow only needs to read the repo. Prevents a compromised
# dependency or step from pushing code, creating releases, or editing issues.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      # Actions are pinned to full commit SHAs (supply-chain hardening). The tag comment
      # records the version. Dependabot (github-actions ecosystem) can bump these pins.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y libpq5
      - run: |
          if git ls-files --error-unmatch .env >/dev/null 2>&1; then
            echo 'ERROR: .env is tracked. Remove it from Git before merging.' >&2
            exit 1
          fi
      - run: npm ci
      - run: npm run db:generate
      - run: npm run typecheck
      - run: npm run build
        env:
          DATABASE_URL: postgresql://arch:arch@localhost:55433/arch_test
          AUTH_SECRET: ci-secret-value-that-is-long-enough
          AUTH_SECRET_WEBHOOK: ci-webhook-secret-value-long-enough
          APP_URL: http://localhost:3000
      - run: npm test
      - run: npm audit --omit=dev --audit-level=high
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: pip install -e clients/python pytest && pytest clients/python/tests
