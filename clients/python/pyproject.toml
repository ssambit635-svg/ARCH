[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "arch-cli"
version = "0.1.0"
description = "ARCH incident management terminal client"
requires-python = ">=3.10"
dependencies = ["click>=8.1,<9", "httpx>=0.27,<1"]
readme = "README.md"

[project.scripts]
arch = "arch_cli.main:cli"

[tool.setuptools.packages.find]
include = ["arch_cli*"]
