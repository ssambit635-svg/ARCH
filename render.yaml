# Render blueprint — ARCH.
#
# The value of this file is that the commands are explicit. Most "the build never finishes"
# reports are a service whose Build Command is `npm run dev`: the dev entrypoint starts an
# embedded PostgreSQL cluster and a watching dev server, so the build step never returns.
#
# Apply with: Render Dashboard → New → Blueprint → pick this repository.
services:
  - type: web
    name: arch
    runtime: node
    plan: starter # 2 GB. Next 16 + Turbopack does not finish reliably in 512 MB.
    region: singapore
    branch: main
    autoDeployTrigger: commit
    buildCommand: npm ci --include=dev && npm run build:deploy
    # Apply schema changes before starting the new web version (Starter or above).
    preDeployCommand: npm run db:migrate
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22.22.3
      - key: NEXT_TELEMETRY_DISABLED
        value: '1'
      # Keep the build inside the instance's memory; without this Turbopack grows until the
      # kernel kills the build and the host restarts it from zero.
      - key: NODE_OPTIONS
        value: --max-old-space-size=1536
      - key: APP_URL
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: AUTH_SECRET
        generateValue: true
      - key: AUTH_SECRET_WEBHOOK
        generateValue: true
      # Optional integrations. Leave empty to keep the offline modes.
      - key: GITHUB_TOKEN
        sync: false
      - key: GITHUB_OWNER
        sync: false
      - key: GITHUB_REPO
        sync: false
      # OAuth sign-in providers. Set these in the Render dashboard (Environment tab).
      # Leave blank to keep sign-in disabled for that provider.
      - key: AUTH_GITHUB_ID
        sync: false
      - key: AUTH_GITHUB_SECRET
        sync: false
      - key: AUTH_GOOGLE_ID
        sync: false
      - key: AUTH_GOOGLE_SECRET
        sync: false
      - key: AUTH_URL
        sync: false
      # Optional real email. Blank disables delivery; it does not send from the web process.
      - key: EMAIL_PROVIDER
        sync: false
      - key: EMAIL_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      # Opt-in on BOTH web and worker after sender verification (default is off).
      - key: FEATURE_WELCOME_EMAIL
        sync: false
