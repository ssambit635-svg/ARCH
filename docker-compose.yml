# ARCH — local development dependencies.
# PostgreSQL 16 for the app, migrations and tests. `docker compose up -d` then `npm run setup`.
# Optional local LLM for AI_PROVIDER="arch-hybrid" (CPU only, free):
#   docker compose --profile ai up -d
#   docker compose exec ollama ollama pull qwen2.5-coder:7b
services:
  postgres:
    image: postgres:16-alpine
    container_name: arch-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: arch
      POSTGRES_PASSWORD: arch
      POSTGRES_DB: arch
      # Tests use a separate database (arch_test) created by scripts/dev-db.mjs / CI.
      POSTGRES_INITDB_ARGS: '--encoding=UTF8 --locale=C'
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U arch -d arch']
      interval: 5s
      timeout: 5s
      retries: 10

  # Local open-source LLM (V3). Not started by default — needs ~6 GB RAM for a 7B Q4 model.
  # Bound to 127.0.0.1 so it is never exposed to the network; ARCH talks to it over localhost.
  ollama:
    image: ollama/ollama:latest
    container_name: arch-ollama
    profiles: ['ai']
    restart: unless-stopped
    ports:
      - '127.0.0.1:11434:11434'
    environment:
      OLLAMA_KEEP_ALIVE: '30m'
      OLLAMA_NUM_PARALLEL: '1'
    volumes:
      - ollama-models:/root/.ollama
      - ./ai:/arch-ai:ro

volumes:
  postgres-data:
  ollama-models:
